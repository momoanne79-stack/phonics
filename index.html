<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#173f73">
<title>그래머샤프 Unit 1-2 핵심표현 학습</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<style>
:root{--navy:#173f73;--blue:#2567ad;--sky:#eef7ff;--line:#d6e7f5;--ink:#15263a;--muted:#63788d;--gold:#ffb84d;--green:#1c9a68;--red:#db514b;--shadow:0 14px 38px rgba(21,63,112,.16)}
*{box-sizing:border-box}
html{background:#eef4f9}
body{margin:0;padding:12px;color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;background:linear-gradient(160deg,#edf7ff,#f7fbff 46%,#fff8ec);min-height:100vh}
button,select{font:inherit}
button{touch-action:manipulation}
#app{max-width:720px;min-height:calc(100vh - 24px);margin:0 auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.hero{padding:25px 20px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--navy),var(--blue));position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero:before{width:150px;height:150px;right:-55px;top:-70px}.hero:after{width:115px;height:115px;left:-42px;bottom:-65px}
.brand{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--gold);color:#4b2b00;font-size:12px;font-weight:1000;position:relative}
.hero h1{font-size:23px;line-height:1.3;margin:8px 0 5px;position:relative}.hero p{font-size:13px;line-height:1.55;margin:0;opacity:.94;font-weight:800;position:relative}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;background:#f6fbff;border-bottom:1px solid #e5eef7}
.sum{background:#fff;border:1px solid #dcebf7;border-radius:13px;text-align:center;padding:8px 3px;color:var(--muted);font-size:11px;font-weight:900}.sum b{display:block;color:var(--navy);font-size:17px;margin-bottom:2px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:9px;background:#f8fbfe;border-bottom:1px solid #e6eef6;position:sticky;top:0;z-index:20}
.tab{min-height:50px;padding:6px 3px;border:0;border-radius:13px;background:#e8f1f9;color:#294a68;font-size:12px;font-weight:1000;cursor:pointer}.tab.active{background:var(--navy);color:#fff;box-shadow:0 5px 15px rgba(23,63,115,.23)}
.view{display:none;padding:16px}.view.active{display:block;animation:fade .2s ease}@keyframes fade{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{border:1.7px solid var(--line);border-radius:19px;padding:16px;background:#fff;margin-bottom:13px}.card.soft{background:var(--sky)}
.eyebrow{color:var(--blue);font-weight:1000;font-size:13px;margin-bottom:6px}.title{font-weight:1000;color:var(--navy);font-size:21px;line-height:1.35;margin:0 0 7px}.desc{color:var(--muted);font-size:14px;line-height:1.58;font-weight:800}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;min-height:30px;padding:5px 10px;border-radius:999px;background:#e8f1f9;color:#315675;font-size:12px;font-weight:1000}.pill.green{background:#e7fbf2;color:#126043}.pill.gold{background:#fff3d7;color:#745000}.pill.red{background:#ffeded;color:#9b332f}
.progress{height:12px;background:#dae8f3;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--green));transition:width .3s ease}
.study-card{text-align:center;min-height:302px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.category{font-size:12px;font-weight:1000;color:var(--blue);letter-spacing:.1px}.korean{font-size:23px;line-height:1.5;font-weight:1000;color:#163650;margin:20px 0 9px}.english{font:700 25px/1.45 Georgia,"Times New Roman",serif;color:#102d4e;margin:8px 0}.english.hidden-text{visibility:hidden}.note{font-size:13px;line-height:1.5;color:#6e8294;font-weight:800;min-height:20px}.flip-hint{font-size:13px;color:#7a8d9d;font-weight:900;margin-top:17px}.listen-wave{height:25px;display:flex;gap:4px;justify-content:center;align-items:center;margin:7px}.listen-wave i{display:block;width:4px;height:7px;background:var(--gold);border-radius:9px}.listen-wave.on i{animation:wave .65s ease-in-out infinite alternate}.listen-wave i:nth-child(2){animation-delay:.12s}.listen-wave i:nth-child(3){animation-delay:.24s}.listen-wave i:nth-child(4){animation-delay:.36s}@keyframes wave{to{height:24px}}
.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}.btn{border:0;border-radius:14px;min-height:52px;padding:11px 9px;background:var(--navy);color:#fff;font-size:15px;font-weight:1000;cursor:pointer}.btn.secondary{background:#e7f0f8;color:#294d6d}.btn.gold{background:var(--gold);color:#4d2d00}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn:disabled{opacity:.42;cursor:not-allowed}.btn:active{transform:scale(.99)}
.tool-row{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px}.select{border:1.5px solid #cfe0ef;border-radius:12px;background:#fff;padding:9px 10px;color:#31516d;font-size:13px;font-weight:900}
.speech-card{text-align:center}.sentence-box{padding:17px 13px;border-radius:17px;background:#f6fbff;border:1.7px solid #dceaf6;margin:12px 0}.sentence-box .english{font-size:23px;margin:4px 0}.count-dots{display:flex;justify-content:center;gap:9px;margin:16px 0}.dot{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#e4edf5;color:#63788d;font-size:14px;font-weight:1000;border:2px solid transparent}.dot.done{background:#ddf8ec;color:#0c6b46;border-color:#43b98c}.dot.current{border-color:var(--gold);background:#fff6df;color:#7b5100}
.mic{width:92px;height:92px;margin:4px auto 8px;border-radius:50%;border:0;background:linear-gradient(145deg,#2d76be,var(--navy));color:white;font-size:38px;box-shadow:0 9px 23px rgba(23,63,115,.28);cursor:pointer}.mic.listening{background:var(--red);animation:pulse 1s infinite}.mic:disabled{opacity:.45}@keyframes pulse{50%{box-shadow:0 0 0 13px rgba(219,81,75,.16)}}
.recognition{min-height:68px;border-radius:14px;padding:11px;background:#f7fafc;color:#506980;font-size:14px;font-weight:850;line-height:1.55;margin-top:10px;display:flex;align-items:center;justify-content:center}.recognition.ok{background:#e6fbf2;color:#116144;border:1.5px solid #54bd91}.recognition.ng{background:#fff0ef;color:#9c3833;border:1.5px solid #ee8b86}.support{font-size:12px;line-height:1.52;color:#6f8295;background:#f5f8fb;border-radius:12px;padding:10px;margin-top:10px;font-weight:800}
.quiz-head{background:#f5faff;border:1.7px solid #dceaf6;border-radius:17px;padding:14px;margin-bottom:12px}.prompt{font-size:21px;line-height:1.55;font-weight:1000;color:#123d62;margin:8px 0}.cloze-label{margin-top:12px;color:#6b8194;font-size:12px;font-weight:1000}.cloze-en{margin:7px 0 12px;padding:14px 10px;border-radius:14px;background:#fff;border:1.5px solid #d8e7f3;text-align:center;color:#153a5c;font:700 22px/1.6 Georgia,"Times New Roman",serif}.blank{display:inline-block;min-width:82px;min-height:31px;margin:0 4px;border-bottom:3px solid var(--blue);color:transparent;vertical-align:baseline;user-select:none}.area-label{text-align:center;font-size:12px;color:#6c8195;font-weight:1000;margin:7px}.answer,.bank{min-height:79px;border-radius:17px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center}.answer{border:2px dashed var(--blue);background:#edf7ff}.bank{border:1.7px solid #dce9f4;background:#f8fbfd}.chip{border:2px solid #b9d5eb;background:#fff;color:#193954;border-radius:12px;padding:11px 14px;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:17px;cursor:grab;user-select:none;touch-action:manipulation}.chip.correct{border-color:var(--green);background:#e5faf1}.chip:active{cursor:grabbing}.sortable-ghost{opacity:.35;background:#e8f1f9!important}.sortable-drag{background:var(--navy)!important;color:#fff!important;transform:scale(1.06)!important}
.feedback{display:none;border-radius:14px;padding:12px;margin-top:11px;font-weight:1000;line-height:1.5;text-align:center}.feedback.show{display:block}.feedback.ok{background:#e3f9ef;color:#116143;border:1.5px solid #4ebb8d}.feedback.ng{background:#ffefee;color:#9c3632;border:1.5px solid #ee8e89}
.choices{display:grid;gap:9px}.choice{width:100%;min-height:58px;text-align:left;border:1.8px solid #cfe0ed;border-radius:14px;padding:12px 14px;background:#fff;color:#17344e;font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:700;cursor:pointer}.choice:hover{background:#f3f9ff}.choice.ok{background:#e4faef;border-color:var(--green);color:#0d6945}.choice.ng{background:#ffefee;border-color:var(--red);color:#9b342f}.choice:disabled{cursor:default}
.finish{text-align:center;padding:10px 0}.emoji{font-size:55px}.big-score{font-size:38px;font-weight:1000;color:var(--navy);margin:8px}.finish .desc{margin-bottom:13px}
.record-list{display:grid;gap:9px}.record{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border-radius:14px;border:1.5px solid #dfeaf4;background:#f8fbfd}.record b{color:var(--navy)}.record small{display:block;color:var(--muted);font-weight:800;margin-top:3px}.record strong{font-size:18px;color:#173f73;white-space:nowrap}
.ok-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:1002;padding:12px 26px;border-radius:999px;background:#e4faef;border:2px solid var(--green);color:#0c6b46;font-size:24px;font-weight:1000;text-align:center;white-space:nowrap;box-shadow:0 10px 30px rgba(28,154,104,.28);animation:pop .95s ease forwards;pointer-events:none}.ok-pop.big{top:42%;padding:17px 31px;background:linear-gradient(135deg,#fff3c7,#e4faef);border:3px solid var(--gold);color:#624000;font-size:28px;box-shadow:0 15px 44px rgba(255,184,77,.38)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.65)}24%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-68%) scale(.94)}}
.confetti{position:fixed;width:8px;height:12px;z-index:1000;pointer-events:none;border-radius:3px;animation:fall 1.15s ease-out forwards}@keyframes fall{to{transform:translateY(190px) rotate(330deg);opacity:0}}
.fire-spark{position:fixed;width:9px;height:9px;border-radius:50%;z-index:1001;pointer-events:none;box-shadow:0 0 8px currentColor;animation:fire 1s ease-out forwards}@keyframes fire{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
.shake{animation:shake .32s ease}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.hidden{display:none!important}
@media(max-width:600px){body{padding:8px}.hero{padding:22px 13px 16px}.hero h1{font-size:20px}.tabs{grid-template-columns:repeat(3,1fr)}.tab{min-height:44px}.view{padding:12px}.summary{grid-template-columns:repeat(2,1fr)}.korean{font-size:21px}.english{font-size:22px}.controls{grid-template-columns:1fr 1fr}.controls .primary-wide{grid-column:1/-1;grid-row:1}.study-card{min-height:285px}.choice{font-size:16px}.chip{font-size:16px;padding:10px 12px}}
</style>
</head>
<body>
<main id="app">
  <header class="hero">
    <span class="brand">수리나무학원 Grammar Sharp</span>
    <h1>Unit 1-2 핵심표현 완전학습</h1>
    <p>뜻→영어 자동학습 · 영어 음성 2회 · 표현별 쉬운 읽기 5회<br>언스크램블 · 4지선다 · 오답 재시험 · 축하 효과</p>
  </header>
  <div class="summary" id="summary"></div>
  <nav class="tabs" id="tabs" aria-label="학습 메뉴"></nav>
  <div id="views"></div>
</main>

<script>
"use strict";
const GROUPS=[
 {id:"v1",name:"주의할 1형식 자동사",items:[
  {en:"A cup of coffee will do.",ko:"커피 한 잔이면 충분할 거야.",key:"do = 충분하다"},
  {en:"Every vote counts in the election.",ko:"선거에서 모든 표가 중요하다.",key:"count = 중요하다"},
  {en:"Age doesn't matter in love.",ko:"나이는 사랑에 있어서 중요하지 않다.",key:"matter = 중요하다",alts:["Age does not matter in love."]},
  {en:"The hot weather lasted until September.",ko:"더운 날씨가 9월까지 지속되었다.",key:"last = 지속되다"},
  {en:"Honesty will pay in the end.",ko:"정직은 결국 이득이 될 거야.",key:"pay = 이익이 되다"},
  {en:"These sleeping pills will work.",ko:"이 수면제가 효과가 있을 거야.",key:"work = 효과가 있다"}
 ]},
 {id:"v2state",name:"2형식 - 상태동사",items:[
  {en:"be happy",ko:"행복하다",key:"be + 형용사"},{en:"keep quiet",ko:"조용히 있다",key:"keep + 형용사"},{en:"stay calm",ko:"침착함을 유지하다",key:"stay + 형용사"},{en:"remain silent",ko:"침묵을 지키다",key:"remain + 형용사"}
 ]},
 {id:"v2change",name:"2형식 - 상태변화동사",items:[
  {en:"become cold",ko:"추워지다",key:"become + 형용사"},{en:"get angry",ko:"화가 나다",key:"get + 형용사"},{en:"come true",ko:"실현되다",key:"come + 형용사"},{en:"go bad",ko:"상하다",key:"go + 형용사"},{en:"go wrong",ko:"잘못되다",key:"go + 형용사"},{en:"grow old",ko:"나이가 들다",key:"grow + 형용사"},{en:"turn pale",ko:"창백해지다",key:"turn + 형용사"},{en:"run short",ko:"부족하다",key:"run + 형용사"},{en:"fall asleep",ko:"잠들다",key:"fall + 형용사"}
 ]},
 {id:"v2sense",name:"2형식 - 인식동사",items:[
  {en:"seem busy",ko:"바빠 보이다",key:"seem + 형용사"},{en:"appear healthy",ko:"건강해 보이다",key:"appear + 형용사"}
 ]},
 {id:"v3",name:"주의할 3형식 동사",items:[
  {en:"enter the room",ko:"방에 들어가다",key:"enter + 장소"},{en:"attend the meeting",ko:"회의에 참석하다",key:"attend + 행사"},{en:"marry Jane",ko:"제인과 결혼하다",key:"marry + 사람"},{en:"answer the question",ko:"질문에 답하다",key:"answer + 질문"},{en:"approach the door",ko:"문에 다가가다",key:"approach + 대상"},{en:"resemble my mom",ko:"엄마와 닮다",key:"resemble + 사람"},{en:"discuss the problem",ko:"문제를 논의하다",key:"discuss + 주제"},{en:"explain the rule",ko:"규칙을 설명하다",key:"explain + 내용"},{en:"mention the name",ko:"이름을 언급하다",key:"mention + 내용"}
 ]},
 {id:"confuse",name:"혼동하기 쉬운 자동사·타동사",items:[
  {en:"lie - lay - lain",ko:"눕다",key:"자동사 lie의 변화"},{en:"lie - lied - lied",ko:"거짓말하다",key:"자동사 lie의 변화"},{en:"lay - laid - laid",ko:"~을 눕히다",key:"타동사 lay의 변화"},{en:"rise - rose - risen",ko:"오르다",key:"자동사 rise의 변화"},{en:"raise - raised - raised",ko:"~을 올리다",key:"타동사 raise의 변화"},{en:"sit - sat - sat",ko:"앉다",key:"자동사 sit의 변화"},{en:"seat - seated - seated",ko:"~을 앉히다",key:"타동사 seat의 변화"}
 ]},
 {id:"v4trap",name:"4형식으로 착각하기 쉬운 3형식",items:[
  {en:"explain the situation to me",ko:"상황을 나에게 설명하다",quizKo:"상황을 나에게 설명하다 (explain 사용)",key:"explain A to B"},
  {en:"describe the situation to me",ko:"상황을 나에게 묘사하다",quizKo:"상황을 나에게 묘사하다 (describe 사용)",key:"describe A to B"},
  {en:"Let me introduce myself to you.",ko:"제가 자기소개할게요.",key:"introduce A to B"},
  {en:"announce the news to the public",ko:"대중에게 그 소식을 발표하다",key:"announce A to B"},
  {en:"propose a new plan to the committee",ko:"위원회에 새로운 계획을 제안하다",key:"propose A to B"},
  {en:"provide Jane with water",ko:"제인에게 물을 제공하다",quizKo:"제인에게 물을 제공하다 (provide A with B)",key:"provide A with B"},
  {en:"provide water to Jane",ko:"제인에게 물을 제공하다",quizKo:"제인에게 물을 제공하다 (provide B to/for A)",key:"provide B to/for A",alts:["provide water for Jane"],note:"provide water for Jane도 정답"}
 ]}
];
const ITEMS=[];
GROUPS.forEach((g,gi)=>g.items.forEach((x,ii)=>ITEMS.push({...x,id:`${g.id}-${ii}`,group:g.name,gi})));
const STORE="surinamu_grammarsharp_unit1_2_master_v1";
const MENU=[{id:"flash",label:"📚 전체학습"},{id:"speech",label:"🎙️ 5회 읽기"},{id:"scramble",label:"🧩 언스크램블"},{id:"choice",label:"✅ 4지선다"},{id:"record",label:"📊 기록"}];
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>Array.from(r.querySelectorAll(q));
let state=loadState(),active="flash",flashIndex=state.flashIndex||0,flashPhase="ko",flashRunning=false,flashToken=0;
let speechIndex=findSpeechStart(),recognition=null,listening=false,gotSpeechResult=false;
let scQueue=[],scPos=0,scFirstCorrect=0,scHadWrong=false,scWrong=new Set(),scLocked=false;
let chQueue=[],chPos=0,chFirstCorrect=0,chHadWrong=false,chWrong=new Set(),chLocked=false;
let scAnswerSortable=null,scBankSortable=null;
let audioCtx=null;
function defaultState(){return{flashIndex:0,flashComplete:false,speechCounts:{},speechComplete:false,scrambleAttempts:0,scrambleBest:0,scramblePass:false,choiceAttempts:0,choiceBest:0,choicePass:false,lastStudy:"-"}}
function loadState(){try{return{...defaultState(),...JSON.parse(localStorage.getItem(STORE)||"{}")}}catch(e){return defaultState()}}
function save(patch={}){state={...state,...patch,lastStudy:new Date().toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})};localStorage.setItem(STORE,JSON.stringify(state));renderSummary()}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function speechDoneCount(){return ITEMS.filter(x=>(state.speechCounts[x.id]||0)>=5).length}
function findSpeechStart(){const i=ITEMS.findIndex(x=>(state.speechCounts[x.id]||0)<5);return i<0?0:i}
function renderSummary(){const data=[['표현',ITEMS.length],['전체학습',state.flashComplete?'완료':'진행'],['5회 읽기',`${speechDoneCount()}/${ITEMS.length}`],['테스트',`${Number(state.scramblePass)+Number(state.choicePass)}/2 PASS`]];$('#summary').innerHTML=data.map(x=>`<div class="sum"><b>${x[1]}</b>${x[0]}</div>`).join('')}
function renderTabs(){const nav=$('#tabs');nav.innerHTML=MENU.map(m=>`<button class="tab ${active===m.id?'active':''}" data-tab="${m.id}">${m.label}</button>`).join('');$$('.tab',nav).forEach(b=>b.onclick=()=>showTab(b.dataset.tab))}
function renderViews(){const root=$('#views');root.innerHTML=MENU.map(m=>`<section id="view-${m.id}" class="view ${active===m.id?'active':''}"></section>`).join('');renderFlash();renderSpeech();renderScrambleHome();renderChoiceHome();renderRecord()}
function showTab(id){stopAllAudio();active=id;renderTabs();$$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${id}`));if(id==='record')renderRecord();if(id==='speech')renderSpeech()}
function stopAllAudio(){flashRunning=false;flashToken++;if(window.speechSynthesis)window.speechSynthesis.cancel();stopRecognition()}

function initScrambleSortables(){if(scAnswerSortable){scAnswerSortable.destroy();scAnswerSortable=null}if(scBankSortable){scBankSortable.destroy();scBankSortable=null}if(typeof Sortable!=='function')return;const onEnd=()=>checkScramble(),opts={group:'grammarsharp-words',animation:280,ghostClass:'sortable-ghost',dragClass:'sortable-drag',swapThreshold:.65,onEnd};scAnswerSortable=new Sortable($('#scAnswer'),opts);scBankSortable=new Sortable($('#scBank'),opts)}
function checkScramble(){if(scLocked||$('#scBank').children.length)return;const idx=scQueue[scPos],x=ITEMS[idx],ans=$$('.chip',$('#scAnswer')).map(c=>c.textContent).join(' '),ok=norm(ans)===norm(x.en);const fb=$('#scFeedback');if(ok){scLocked=true;if(!scHadWrong)scFirstCorrect++;fb.className='feedback ok show';fb.textContent='정답입니다! 다음 표현으로 넘어갑니다.';showOk('정답!');setTimeout(()=>{scPos++;scHadWrong=false;scLocked=false;renderScrambleQuestion()},900)}else{scHadWrong=true;scWrong.add(idx);fb.className='feedback ng show';fb.textContent='순서가 아직 맞지 않습니다. 답안의 단어를 다시 눌러 고쳐 보세요.';showWrong($('#scAnswer'))}}
function finishScramble(){const total=scQueue.length,score=Math.round(scFirstCorrect/Math.max(1,total)*100),wrong=[...scWrong],full=total===ITEMS.length,pass=wrong.length===0;save({scrambleAttempts:state.scrambleAttempts+1,scrambleBest:full?Math.max(state.scrambleBest||0,score):state.scrambleBest,scramblePass:pass?true:state.scramblePass});const v=$('#view-scramble');v.innerHTML=`<div class="card finish"><div class="emoji">${pass?'🏆':'📝'}</div><h2 class="title">${pass?'언스크램블 PASS!':'오답을 다시 풀어 마무리해요'}</h2><div class="big-score">${scFirstCorrect}/${total}</div><div class="desc">${pass?'모든 표현을 정확히 완성했습니다.':`이번 풀이에서 다시 확인할 표현 ${wrong.length}개`}</div>${wrong.length?'<button class="btn gold" id="retrySc">오답만 다시 풀기</button>':''}<button class="btn secondary" id="againSc">전체 다시 풀기</button></div>`;if(pass)setTimeout(()=>showOk('언스크램블 PASS!',true),80);if($('#retrySc'))$('#retrySc').onclick=()=>startScramble(wrong);$('#againSc').onclick=()=>startScramble(ITEMS.map((_,i)=>i));renderSummary()}

function renderChoiceHome(){const v=$('#view-choice');if(!v)return;v.innerHTML=`<div class="card soft"><div class="eyebrow">STEP 4</div><h2 class="title">4지선다 빈칸 표현 테스트</h2><div class="desc">우리말 뜻과 영어 표현을 함께 보고, 밑줄에 들어갈 핵심 동사 표현을 고르세요. 둘 다 가능한 동사는 같은 보기에 넣지 않았습니다.</div></div><div class="card"><div class="record-list"><div class="record"><div><b>문제 수</b><small>핵심 동사·동사 변화 고르기</small></div><strong>${ITEMS.length}개</strong></div><div class="record"><div><b>최고 점수</b><small>전체 첫 선택 기준</small></div><strong>${state.choiceBest||0}점</strong></div><div class="record"><div><b>통과</b><small>오답 재시험까지 완료</small></div><strong>${state.choicePass?'PASS':'대기'}</strong></div></div><button class="btn" id="startChoice">전체 문제 시작</button></div>`;$('#startChoice').onclick=()=>startChoice(ITEMS.map((_,i)=>i))}
function startChoice(queue){initAudio();chQueue=[...queue];chPos=0;chFirstCorrect=0;chHadWrong=false;chWrong=new Set();chLocked=false;renderChoiceQuestion()}
function clozeSpec(x){const irregular={
 'confuse-0':{before:'lie - ',answer:'lay - lain',wrong:['lied - lied','laid - laid','rose - risen'],speechCore:['lie'],blankText:'_______ - _______'},
 'confuse-1':{before:'lie - ',answer:'lied - lied',wrong:['lay - lain','laid - laid','rose - risen'],speechCore:['lie'],blankText:'_______ - _______'},
 'confuse-2':{before:'lay - ',answer:'laid - laid',wrong:['lay - lain','lied - lied','rose - risen'],speechCore:['lay'],blankText:'_______ - _______'},
 'confuse-3':{before:'rise - ',answer:'rose - risen',wrong:['raised - raised','sat - sat','seated - seated'],speechCore:['rise'],blankText:'_______ - _______'},
 'confuse-4':{before:'raise - ',answer:'raised - raised',wrong:['rose - risen','sat - sat','seated - seated'],speechCore:['raise'],blankText:'_______ - _______'},
 'confuse-5':{before:'sit - ',answer:'sat - sat',wrong:['seated - seated','rose - risen','raised - raised'],speechCore:['sit'],blankText:'_______ - _______'},
 'confuse-6':{before:'seat - ',answer:'seated - seated',wrong:['sat - sat','rose - risen','raised - raised'],speechCore:['seat'],blankText:'_______ - _______'}
 };if(irregular[x.id])return{after:'',...irregular[x.id]};const v1={"v1-0":"do","v1-1":"counts","v1-2":"matter","v1-3":"lasted","v1-4":"pay","v1-5":"work"};let answer=v1[x.id]||(x.id==='v4trap-2'?'introduce':words(x.en)[0]);const pos=x.en.toLowerCase().indexOf(answer.toLowerCase()),before=x.en.slice(0,pos),after=x.en.slice(pos+answer.length);let wrong;if(x.id.startsWith('v1-'))wrong=answer==='counts'?['enters','attends','resembles']:answer==='lasted'?['entered','attended','resembled']:['enter','attend','resemble'];else if(x.id.startsWith('v2'))wrong=['enter','attend','discuss'];else wrong=['go','fall','appear'];return{before,after,answer,wrong,speechCore:words(answer),blankText:'________'}}
function renderChoiceQuestion(){const v=$('#view-choice');if(chPos>=chQueue.length){finishChoice();return}const idx=chQueue[chPos],x=ITEMS[idx],spec=clozeSpec(x),opts=shuffle([spec.answer,...spec.wrong]);v.innerHTML=`<div class="quiz-head"><div class="status"><div class="pills"><span class="pill">${chPos+1} / ${chQueue.length}</span><span class="pill gold">${esc(x.group)}</span></div><span class="pill green">첫 정답 ${chFirstCorrect}</span></div><div class="progress"><div class="bar" style="width:${chPos/chQueue.length*100}%"></div></div><div class="prompt">${esc(x.quizKo||x.ko)}</div><div class="cloze-label">영어 표현</div><div class="cloze-en">${esc(spec.before)}<span class="blank">${esc(spec.blankText)}</span>${esc(spec.after)}</div><div class="note">밑줄에 들어갈 핵심 동사 표현을 고르세요.</div></div><div class="choices">${opts.map(o=>`<button class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="chFeedback" class="feedback"></div>`;$$('.choice').forEach(b=>b.onclick=()=>chooseAnswer(b.dataset.v,b))}
function chooseAnswer(value,b){if(chLocked)return;const idx=chQueue[chPos],spec=clozeSpec(ITEMS[idx]),fb=$('#chFeedback');if(value===spec.answer){chLocked=true;b.classList.add('ok');if(!chHadWrong)chFirstCorrect++;fb.className='feedback ok show';fb.textContent=`정답입니다! ${spec.before}${spec.answer}${spec.after}`;showOk('정답!');setTimeout(()=>{chPos++;chHadWrong=false;chLocked=false;renderChoiceQuestion()},900)}else{chHadWrong=true;chWrong.add(idx);b.classList.add('ng');b.disabled=true;fb.className='feedback ng show';fb.textContent='다시 생각해 보세요. 다른 동사 표현을 골라 보세요.';showWrong(b)}}
function finishChoice(){const total=chQueue.length,score=Math.round(chFirstCorrect/Math.max(1,total)*100),wrong=[...chWrong],full=total===ITEMS.length,pass=wrong.length===0;save({choiceAttempts:state.choiceAttempts+1,choiceBest:full?Math.max(state.choiceBest||0,score):state.choiceBest,choicePass:pass?true:state.choicePass});const v=$('#view-choice');v.innerHTML=`<div class="card finish"><div class="emoji">${pass?'🏆':'📝'}</div><h2 class="title">${pass?'4지선다 PASS!':'오답을 다시 풀어 100점에 도전해요'}</h2><div class="big-score">${chFirstCorrect}/${total}</div><div class="desc">${pass?'모든 표현을 정확히 골랐습니다.':`이번 풀이에서 다시 확인할 표현 ${wrong.length}개`}</div>${wrong.length?'<button class="btn gold" id="retryCh">오답만 다시 풀기</button>':''}<button class="btn secondary" id="againCh">전체 다시 풀기</button></div>`;if(pass)setTimeout(()=>showOk('4지선다 PASS!',true),80);if($('#retryCh'))$('#retryCh').onclick=()=>startChoice(wrong);$('#againCh').onclick=()=>startChoice(ITEMS.map((_,i)=>i));renderSummary()}

function renderRecord(){const v=$('#view-record');if(!v)return;const readTotal=Object.values(state.speechCounts).reduce((a,b)=>a+Math.min(5,Number(b)||0),0);v.innerHTML=`<div class="card soft"><div class="eyebrow">LEARNING RECORD</div><h2 class="title">학습 기록</h2><div class="desc">이 기기에 자동 저장됩니다. 각 표현의 필수 핵심어를 확인하며 5번 반복해 암기합니다.</div></div><div class="card"><div class="record-list"><div class="record"><div><b>전체학습</b><small>44개 자동 플래시 학습</small></div><strong>${state.flashComplete?'완료':'진행 중'}</strong></div><div class="record"><div><b>5회 읽기</b><small>총 성공 ${readTotal} / ${ITEMS.length*5}회</small></div><strong>${speechDoneCount()}/${ITEMS.length}</strong></div><div class="record"><div><b>언스크램블</b><small>시도 ${state.scrambleAttempts}회 · 최고 ${state.scrambleBest}점</small></div><strong>${state.scramblePass?'PASS':'대기'}</strong></div><div class="record"><div><b>4지선다</b><small>시도 ${state.choiceAttempts}회 · 최고 ${state.choiceBest}점</small></div><strong>${state.choicePass?'PASS':'대기'}</strong></div><div class="record"><div><b>마지막 학습</b><small>브라우저 저장 기록</small></div><strong style="font-size:14px">${esc(state.lastStudy)}</strong></div></div></div><div class="card"><h3 class="title" style="font-size:17px">음성인식 사용 안내</h3><div class="desc">Chrome 또는 Edge에서 파일을 열고 마이크 사용을 허용하세요. 받아쓴 영어와 인식률은 표시하지 않으며, 필수 핵심어가 모두 인식돼야 1회 성공합니다.</div></div><button class="btn red" id="resetAll">전체 기록 초기화</button>`;$('#resetAll').onclick=()=>{if(confirm('모든 학습 기록을 초기화할까요?')){stopAllAudio();localStorage.removeItem(STORE);state=loadState();flashIndex=0;speechIndex=0;renderSummary();renderViews();showTab('record')}}}
function init(){renderSummary();renderTabs();renderViews();if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=()=>{};document.addEventListener('pointerdown',initAudio,{once:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAllAudio()})}
init();
</script>
